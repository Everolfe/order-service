server.port=${APP_PORT:8083}

spring.datasource.username=${D_DB_USERNAME}
spring.datasource.password=${D_DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://${D_DB_HOST}:${D_DB_HOST_PORT}/${D_DB_NAME}

user.service.url=${DOCKER_USER_URL}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service-app:8082/api/auth/well-known/jwks.json
