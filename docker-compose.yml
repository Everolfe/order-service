services:
  postgres-db:
    image: "postgres:15-alpine"
    container_name: "order-service-db"
    environment:
      POSTGRES_DB : ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service-app:
    container_name: order-service-app
    build: .
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_PORT: ${APP_PORT}
      D_DB_USERNAME: ${DB_USERNAME}
      D_DB_PASSWORD: ${DB_PASSWORD}
      D_DB_HOST_PORT: ${D_DB_HOST_PORT}
      D_DB_NAME: ${DB_NAME}
      DOCKER_USER_URL: ${DOCKER_USER_URL}
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres-data:
